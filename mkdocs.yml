site_name: TutorWays
site_description: Documentation for TutorWays, an open benchmarking framework for AI tutors and the ways they reach students.
site_url: https://tutorways.github.io/Documentation/
repo_url: https://github.com/tutorways/Documentation
repo_name: tutorways/Documentation

theme:
  name: material
  custom_dir: overrides
  font: false
  logo: assets/brand/mark-white.svg
  favicon: assets/brand/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - How to Use Our Bots:
      - Overview: how-to-use-our-bots/index.md
      - Current Bots:
          - Data 8:
              - Getting Started: how-to-use-our-bots/data8/getting-started.md
  - Tutor Options:
      - Overview: tutor-options/index.md
      - Interfaces:
          - Local CLI: tutor-options/interfaces/local-cli.md
          - Discord: tutor-options/interfaces/discord.md
          - Slack: tutor-options/interfaces/slack.md
  - Persistent AIs:
      - Overview: persistent-ais/index.md
      - Grok Bot: persistent-ais/grok-bot.md
      - Muse: persistent-ais/muse.md
  - Model Options:
      - Overview: model-options/index.md
      - Data 8:
          - GPT Corpus: model-options/data8/corpus-options.md
          - OpenRouter Brain: model-options/data8/openrouter-options.md
          - OpenAI Brain: model-options/data8/openai-options.md
  - Benchmarks:
      - Overview: benchmark.md
      - How Evaluation Works: benchmark/evaluation.md
  - Tradeoffs:
      - Overview: tradeoffs/index.md
      - RAG: tradeoffs/rag.md
      - LangChain and LangGraph: tradeoffs/langchain-langgraph.md
      - vLLM: tradeoffs/vllm.md
      - KV Caching: tradeoffs/kv-caching.md
  - Contact: contact.md

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-tutor.js
  - javascripts/steps.js
  - javascripts/section-chips.js
  - javascripts/journey.js
  - javascripts/landing.js

strict: true
